[project]
name = "ckan-fastapi-backend"
version = "2.0.0"
description = "CKAN Knowledge-aware Movie Recommendation Platform Unified Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "neo4j>=5.18.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "torch>=2.2.0",
    "numpy>=1.26.4",
    "scikit-learn>=1.4.1",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "tqdm>=4.66.0",
    "email-validator>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

