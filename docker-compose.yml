services:
  postgres:
    image: postgres:16-alpine
    container_name: ckan-postgres
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: ckan_recommendation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ckan_recommendation"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ckan-network

  neo4j:
    image: neo4j:5-community
    container_name: ckan-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/neo4j_password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: 'apoc.*'
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p neo4j_password 'RETURN 1'"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - ckan-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ckan-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      DATABASE_URL: "postgresql://postgres:postgres_password@postgres:5432/ckan_recommendation"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "neo4j_password"
      JWT_SECRET: "ckan_secret_jwt_key_2026_super_secure"
      DATA_DIR: "/app/data/movie"
      MODEL_PATH: "/app/models/ckan_movie.pt"
      CACHE_PATH: "/app/models/cache/propagation_cache.pkl"
      METADATA_PATH: "/app/data/movie/movies_metadata.json"
      KG_PATH: "/app/data/movie/kg_final.npy"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - ckan-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ckan-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - ckan-network

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:

networks:
  ckan-network:
    driver: bridge

